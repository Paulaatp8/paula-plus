<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paula+</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="assets/favicon.png">
</head>
<body>
<div class="background-gradient"></div>
<header>
    <div class="logo">
        <img
        src="assets/favicondark.png"
        alt="Paula+"
        class="logoIcon"
    >
    </div>
    <div class="languageSwitcher">
    <button id="englishBtn">
        EN
    </button>
    <span>/</span>
    <button id="spanishBtn">
        ES
    </button>
    <button
    id="settingsBtn"
    class="filterButton">
    ⚙️
</button>
</div>
</header>
<section class="hero">
    <h1>My private cinema.</h1>
    <p id="movieCounter">
        Loading...
    </p>
</section>
<div class="topControls">
    <input
        type="text"
        id="searchInput"
        placeholder="Search your watchlist..."
    >
<button type="button" id="releaseDateBtn" class="filterButton">
    Release Date
</button>
<button type="button" id="sortAZBtn" class="filterButton">
    Sort A-Z
</button>
<select id="platformFilter" class="filterButton">
    <option value="all">
        All Movies
    </option>
</select>
<button type="button" id="releasedFilterBtn" class="filterButton">
    Released Only
</button></div>
<main>
    <div id="movieGrid">
    </div>
</main>
<button id="randomMovieButton">
    🎲
</button>
<button id="scrollTopButton">
    ▲
</button>
<button id="addMovieButton">
    +
</button>
<!-- Add Movie Modal -->
<div id="modalOverlay" class="hidden">
    <div id="addMovieModal">
        <button id="closeModal">
            ✖
        </button>
        <h2>Add a movie</h2>
        <input
            id="modalSearch"
            type="text"
            placeholder="Search a movie..."
        >
        <div id="searchResults">
        </div>
    </div>
</div>
<div id="deleteBanner" class="deleteBanner hidden">
    <span id="deleteText"> Remove movie? </span>
    <div class="deleteActions">
        <button id="cancelDelete">
            ✖
        </button>
        <button id="confirmDelete">
            Delete
        </button>
    </div>
</div>
<div id="moviePreviewOverlay" class="hidden">
    <div id="moviePreviewContent">
    </div>
</div>
<div id="randomMovieModal">
    <div id="randomMovieBackdrop" class="randomMovieContent">
    <span id="closeRandomMovie">✕</span>
    <div class="randomMovieInfo">
        <h2 id="randomMovieTitle"></h2>
        <p id="randomMovieOverview"></p>
        <p id="randomMovieStreaming"></p>
<button id="rerollMovie">
            Pick Another
        </button>
    </div>
</div>
</div>
<div
    id="settingsModal"
    class="hidden">
    <div id="settingsContent">
    <button id="closeSettings">
        ✖
    </button>
    <h2 id="settingsTitle">
    My Streaming Services
</h2>
        <div id="servicesList">
        </div>
        <button id="saveServices">
            Save
        </button>
    </div>
</div>
<script src="config.js"></script>
<script src="storage.js"></script>
<script src="language.js"></script>
<script src="tmdb.js"></script>
<script src="app.js"></script>
</body>
</html>
